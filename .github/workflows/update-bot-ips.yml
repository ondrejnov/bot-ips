name: Update bot IP lists

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - bot_ips.py
      - sources.json
      - tests/**
      - .github/workflows/update-bot-ips.yml

permissions:
  contents: write

concurrency:
  group: bot-ips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate JSON and TXT
        run: python3 bot_ips.py
      - name: Commit and push lists
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          git add -- data/bot-ips.json data/bot-ips.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update bot IP lists"
          git push origin "HEAD:${TARGET_REF}"
